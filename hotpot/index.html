function lbLoad(){try{return JSON.parse(localStorage.getItem('hotpot_lb')||'{}');}catch(e){return{};}}

let lastEntry=null;
function loadBonus(){try{return +localStorage.getItem('hotpot_bonus')||0;}catch(e){return 0;}}
function saveBonus(n){if(n>loadBonus()){try{localStorage.setItem('hotpot_bonus',String(n));}catch(e){}}}
function loadEndings(){try{return JSON.parse(localStorage.getItem('hotpot_endings')||'[]');}catch(e){return[];}}
function saveEnding(k){const a=loadEndings();if(!a.includes(k)){a.push(k);try{localStorage.setItem('hotpot_endings',JSON.stringify(a));}catch(e){}}}
function lbAdd(lv,entry){const d=lbLoad();const a=d[lv]||[];a.push(entry);a.sort((x,y)=>y.s-x.s);d[lv]=a.slice(0,10);lbSave(d);return d[lv];}
function lbRename(lv,id,name){const d=lbLoad();(d[lv]||[]).forEach(e=>{if(e.id===id)e.n=name;});lbSave(d);}
function renderLB(lv){
  const a=(lbLoad()[lv]||[]),el=$('lb');
  const rank=lastEntry?a.findIndex(e=>e.id===lastEntry.id):-1;
  el.innerHTML=`<div>本機排行榜（${LEVELS[lv-1].name}）${rank>=0?`｜你的成績排第 <b>${rank+1}</b> 名`:'｜這次沒擠進前 10 名'}</div>`+
    `<div>名字：<input id="lbName" maxlength="12" value="${getName().replace(/"/g,'&quot;')}"></div>`+
    `<ol>${a.map(e=>`<li class="${lastEntry&&e.id===lastEntry.id?'me':''}">${e.n.replace(/</g,'&lt;')}　${e.s} 分${e.w?' ☀':''}</li>`).join('')||'<li>還沒有紀錄</li>'}</ol>`;
  $('lbName').onchange=e=>{const n=(e.target.value||'').trim().slice(0,12)||'無名火鍋客';setName(n);if(lastEntry){lbRename(lv,lastEntry.id,n);}renderLB(lv);};
}

function makeDecor(key){
  const r=rng(key.length*977+13+key.charCodeAt(0)),items=[];
  const P=(n,type,rmin,rmax)=>{for(let i=0;i<n;i++){items.push({type,a:r()*Math.PI*2,d:rmin+r()*(rmax-rmin),ph:r()*6,rot:r()});}};
  if(key==='mala'){P(7,'oil',4,26);P(6,'chili',8,29);P(10,'pepper',3,30);P(3,'garlic',8,28);}
  if(key==='kombu'){P(8,'ripple',4,26);P(5,'kelp',8,26);P(10,'onion',5,30);P(2,'mush',10,24);}
  if(key==='suan'){P(8,'fat',4,28);P(12,'cabbage',4,29);P(6,'pork',8,27);}
  if(key==='bone'){P(6,'fat',4,28);P(5,'bonepc',8,26);P(8,'goji',4,29);P(8,'onion',5,29);}
  return items;
}
const brothDecor={};for(const k in BROTHS)brothDecor[k]=makeDecor(k);

let ac=null,muted=false;
function AC(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return ac;}
function tone(type,f1,f2,dur,vol,delay){const a=AC();if(!a||muted)return;try{const o=a.createOscillator(),v=a.createGain(),n=a.currentTime+(delay||0);o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),n+dur);v.gain.setValueAtTime(vol,n);v.gain.exponentialRampToValueAtTime(0.0001,n+dur);o.connect(v);v.connect(a.destination);o.start(n);o.stop(n+dur+0.02);}catch(e){}}

const slots=()=>potMode==='yy'?SLOTS_YY:SLOTS;

function stOf(o){if(SPECIAL(o.type))return'special';if(o.mut)return'mut';if(o.t<o.cook)return'raw';if(o.t<o.cook+winOf(o))return'ok';return'over';}

function freeSlot(side){const used=new Set(pot.map(o=>o.slot));const f=[];slots().forEach((s,i)=>{if(!used.has(i)&&(!side||sideOf(i)===side))f.push(i);});return f.length?pick(f):-1;}

function giveIngredient(x,y,prefix,newChance){
  const pool=['meat','cab','egg','ball','taro','duck','tofu','enoki','corn'].concat(level.plates.filter(k=>k==='cil'||k==='fen'));
  const onTable=plates.filter(k=>k&&stock[k]>0);
  const emptyIdx=plates.findIndex(k=>!k||stock[k]<=0);
  const notOn=pool.filter(k=>!onTable.includes(k));
  if(emptyIdx>=0&&notOn.length&&Math.random()<newChance){
    const fresh=notOn.filter(k=>!BASE.includes(k));const k=fresh.length&&Math.random()<0.75?pick(fresh):pick(notOn);
    plates[emptyIdx]=k;stock[k]=(stock[k]||0)+(BASE.includes(k)?4:5);stats.newIng++;
    const[px,py]=PLATE_POS[emptyIdx];burst(px,py,16,'#9fffb0',26);pop(x,y,`${prefix}新食材：${ING[k].name}！`,'#9fffb0',true);
  }else if(onTable.length){const k=pick(onTable);stock[k]+=3;pop(x,y,`${prefix}${ING[k].name} +3`,'#ffe9b0');}
}

// ---------- hit tests ----------
function hitIng(x,y,t){for(const o of pot){const[p,q]=slotPos(o,t);if(Math.abs(x-p)<=6&&Math.abs(y-q)<=6)return o;}return null;}
function hitPlate(x,y){for(let i=0;i<PLATE_POS.length;i++){const[p,q]=PLATE_POS[i];if(plates[i]&&Math.abs(x-p)<=12&&Math.abs(y-q)<=7)return i;}return -1;}
function hitTray(x,y){for(const k in TRAY_POS){if(k==='momegg'&&!level.mom)continue;if(k==='drink'&&!level.drinks)continue;const[p,q]=TRAY_POS[k];if(Math.abs(x-p)<=11&&Math.abs(y-q)<=9)return k;}return null;}
function hitChar(x,y){for(const c of active()){const p=charPos(c),w=c.kind==='couple'?27:15;if(x>=p.x-w&&x<=p.x+w&&y>=p.y-6&&y<=p.y+37)return c;}return null;}
function hitFridge(x,y){return x>=FRIDGE.x-2&&x<=FRIDGE.x+FRIDGE.w+2&&y>=FRIDGE.y&&y<=FRIDGE.y+FRIDGE.h+2;}
function hitAngel(x,y){return angel&&angel.phase==='wait'&&Math.abs(x-angel.x)<=18&&y>=angel.y+10&&y<=angel.y+40;}
function hitDoor(x,y){return x>=376&&x<=398&&y>=110&&y<=178;}
function inPot(x,y){return Math.hypot(x-POT.x,y-POT.y)<=40;}
const potSide=x=>x<POT.x?'L':'R';
function inThrow(x){return x>=376;}
function hoverTarget(t){
  if(state!=='play')return null;
  if(held)return hitChar(mx,my)||(potMode==='yy'&&inPot(mx,my)?'side'+potSide(mx):null);
  if(hitAngel(mx,my))return'angel';
  const tk=hitTray(mx,my);
  return hitIng(mx,my,t)||(tk&&tray[tk]>0?tk:null)||(hitPlate(mx,my)>=0?'p'+hitPlate(mx,my):null)||(hitFridge(mx,my)?'fridge':null)||(knock.state==='active'&&hitDoor(mx,my)?'door':null)||hitChar(mx,my);
}

// ---------- interaction ----------
function click(x,y){
  AC();if(state!=='play')return;
  const t=performance.now();
  if(held){
    const c=hitChar(x,y);if(c){feed(c);return;}
    if(inThrow(x)){throwItem(x,y);return;}
    if(inPot(x,y)){dropHeldInPot(potMode==='yy'?potSide(x):null);return;}
    if(hitTray(x,y)||hitPlate(x,y)>=0){returnHeld();return;}
    return;
  }
  if(hitAngel(x,y)){signAngel();return;}
  const o=hitIng(x,y,t);if(o){pot.splice(pot.indexOf(o),1);held=o;sfx.pick();return;}
  const tk=hitTray(x,y);
  if(tk){if(tray[tk]<=0)return;
    if(SPECIAL(tk)){tray[tk]--;held={type:tk,src:'tray'};sfx.combo();return;}
    if(potMode==='yy'){tray[tk]--;held=newItem(tk,'tray');sfx.pick();return;}
    const it=newItem(tk,'tray');if(placeInPot(it))tray[tk]--;return;}
  const pi=hitPlate(x,y);
  if(pi>=0){const k=plates[pi];
    if(stock[k]<=0){pop(PLATE_POS[pi][0],PLATE_POS[pi][1]-10,'沒了！去冰箱找找','#ff9a9a');sfx.bad();return;}
    if(potMode==='yy'){stock[k]--;held=newItem(k,'plate');sfx.pick();return;}
    if(placeInPot(newItem(k,'plate')))stock[k]--;return;}
  if(hitFridge(x,y)){openFridge();return;}
  if(knock.state==='active'&&hitDoor(x,y)){letNeighborIn();return;}
  const c=hitChar(x,y);if(c)toggleGuard(c);
}
function dropHeldInPot(side){
  if(SPECIAL(held.type)){returnHeld();return;}
  if(placeInPot(held,side))held=null;
}
function returnHeld(){
  const h=held;if(!h)return;
  if(SPECIAL(h.type)){tray[h.type]++;held=null;sfx.pick();return;}
  if(h.src==='plate'&&h.t===0){stock[h.type]=(stock[h.type]||0)+1;held=null;sfx.pick();return;}
  if(h.src==='tray'&&h.t===0){tray[h.type]++;held=null;sfx.pick();return;}
  if(placeInPot(h,null))held=null;
}

// ---------- update ----------
function update(dt,t){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.l-=dt;if(p.l<=0)parts.splice(i,1);}
  const sr=state==='play'?aroma()*0.25:0.35;
  if(Math.random()<sr){const a=Math.random()*6.28,d=Math.random()*28;steam.push({x:POT.x+Math.cos(a)*d,y:POT.y+Math.sin(a)*d,l:1,s:Math.random()*6});}
  for(let i=steam.length-1;i>=0;i--){const p=steam[i];p.y-=10*dt;p.x+=Math.sin((p.y+p.s)/6)*0.15;p.l-=dt*0.45;if(p.l<=0)steam.splice(i,1);}
  for(let i=steals.length-1;i>=0;i--){const s=steals[i];s.k+=dt*2;if(s.k>=1)steals.splice(i,1);}
  if(flashT>0)flashT-=dt;if(fridgeOpen>0)fridgeOpen-=dt;
  if(state==='ending'){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0||p.y>H)parts.splice(i,1);}return;}
  if(state!=='play')return;
  gameT+=dt;const prog=gameT/DUR;
  if(fridgeCD>0)fridgeCD-=dt;
  updateMom(dt);
  const BON=level.bonus;
  const heatMul=scolding()?0.25:1;
  for(let i=pot.length-1;i>=0;i--){
    const o=pot[i];o.t+=dt*speedOf(o)*heatMul;
    if(!o.rolled&&o.t>=o.cook&&(o.type==='taro'||o.type==='cil'||o.type==='fen')){o.rolled=true;const ch=o.type==='taro'?CFG.poison:o.type==='cil'?CFG.mutCil:CFG.mutFen;
      if(Math.random()<ch){o.mut=true;const[p,q]=slotPos(o,t);const col=o.type==='taro'?'#8a4bff':o.type==='cil'?'#9dff3b':'#ffe066';burst(p,q,26,col,30);pop(p,q-14,`${ING[o.type].name}變成${MUT_NAME[o.type]}了……？！`,col);sfx.poison();}}
    if(o.mut&&Math.random()<0.15){const[p,q]=slotPos(o,t);parts.push({x:p+Math.random()*8-4,y:q+Math.random()*8-4,vx:0,vy:-6,l:0.4,col:o.type==='taro'?'#b46bff':o.type==='cil'?'#9dff3b':'#ffe066',sz:1});}
    if(level.mom&&!o.mut&&o.t>o.cook+winOf(o)+CFG.burnT){const[p,q]=slotPos(o,t);pot.splice(i,1);burst(p,q,14,'#333',18);addWaste(p,q-12,`${ING[o.type].name}焦掉了！`);}
  }
  active().forEach(c=>{
    if(c.stun>0){c.stun-=dt;if(c.stun<=0){const p=charPos(c);pop(p.x,p.y-12,'活過來了！','#ffe9b0');}}
    if(c.moodT>0)c.moodT-=dt;
    if(c.debuff){c.debuff.t-=dt;if(c.debuff.t<=0)c.debuff=null;}
    const sleepy=c.debuff&&c.debuff.type==='sleepy'?2:1;
    c.sat=Math.max(0,c.sat-dt*(c.kind==='cat'?(BON?1.2:0.15):(c.guard?CFG.drainGuard:CFG.drainTable)*(c.hungry||1)*sleepy*(BON?2.4:1)));
    if(c.guard&&c.sat<=0){const p=charPos(c);c.guard=false;c.spot=-1;pop(p.x,p.y-12,'餓到沒力了……','#ff9a9a');}
    if(c.kind==='couple'){c.stealT-=dt;if(c.stealT<=0){c.stealT=12;if(c.sat<60&&!scolding())coupleSteal(c);}}
    if(c.nb==='sword'&&!c.guard&&c.stun<=0&&!scolding()){c.swordT-=dt;if(c.swordT<=0){c.swordT=14;swordServe(c);}}
    if(c.nb==='volley'&&c.guard){c.spikeT-=dt;if(c.spikeT<=0){c.spikeT=4;if(Math.random()<0.4)spike(c);}}
    if(c.nb==='staff'&&!c.guard&&c.stun<=0){c.soupT-=dt;if(c.soupT<=0){c.soupT=55;soupBuff=30;sfx.chime();burst(POT.x,POT.y,30,'#ffe066',30);pop(POT.x,POT.y-50,'店員：「幫您加湯～」30 秒內煮更快、更營養！','#ffe066',true);}}
  });
  if(!knock.nextAt)knock.nextAt=DUR*0.33;
  if(!level.bonus&&knock.state==='none'&&knock.count<2&&gameT>=knock.nextAt&&!CHARS[3].active){if(knock.pending){applyNeighbor(knock.pending);knock.pending=null;}knock.count++;knock.state='active';knock.t=12;pop(300,108,(knock.count>1?'又有人來敲門了……':'')+CHARS[3].knockText,'#ffe066',true);[0,.35,.7].forEach(d=>setTimeout(sfx.thud,d*1000));}
  if(knock.state==='active'){knock.t-=dt;if(knock.t<=0){knock.state='done';pop(330,108,CHARS[3].name+'離開了……','#ff9a9a');neighborLeft();}}
  if(soupBuff>0)soupBuff-=dt;if(slashT>0)slashT-=dt;
  if(coupleOut){coupleOut.x+=55*dt;if(coupleOut.x>500)coupleOut=null;}
  if(!BON&&!angel&&killsSinceAngel>=CFG.angelKills+stats.angel*4)spawnAngel();
  if(angel){
    if(angel.phase==='down'){angel.y+=140*dt;if(angel.y>=176){angel.y=176;angel.phase='wait';pop(angel.x,angel.y-14,'請簽收～','#fff6c8');}}
    else if(angel.phase==='wait'){angel.t-=dt;if(angel.t<=0){angel.phase='up';pop(angel.x,angel.y-14,'沒人簽收，飛走了……','#ff9a9a');}}
    else{angel.y-=160*dt;if(angel.y<-60)angel=null;}
  }
  if(level.boss&&!boss&&!bossDone&&prog>=level.boss.at)spawnBoss();
  if(waveIdx<level.waves.length&&prog>=level.waves[waveIdx][0]){waveLeft=level.waves[waveIdx][1];waveT=0;waveIdx++;
    pop(300,70,waveIdx===level.waves.length?'天快亮了，最後一波殭屍潮！':'殭屍潮來了！','#ff6a6a',true);music.sting();}
  if(waveLeft>0){waveT-=dt;if(waveT<=0){spawnZombie();waveLeft--;waveT=0.7;}}
  const near0=zombies.filter(z=>!z.dead&&!z.flee&&z.x<=CFG.guardRange);
  const gN=CHARS.filter(c=>c.active&&c.guard).length;
  if(gN&&!near0.some(z=>z.atDoor)&&doorHP<100){doorHP=Math.min(100,doorHP+CFG.repair*gN*dt);if(Math.random()<dt*0.6)burst(386,130+Math.random()*30,3,'#e0b84a',10);}
  const fast=prog>=level.fastAt;if(fast&&!fastSaid&&level.id>1){fastSaid=true;pop(240,60,'夜更深了……節奏越來越快！','#ffb0b0',true);}
  music.setIntensity((fast||waveLeft>0||near0.length>=3||doorHP<35||boss)?2:(zombies.length>=2?1:0),fast?level.fastMul:1);
  spawnT-=dt;if(!BON&&spawnT<=0){spawnZombie();spawnT=Math.max(CFG.spawnMin,CFG.spawnBase/(aroma()*(CFG.spawnEarly+prog*CFG.spawnGrow)))*(boss?1.35:1)/(level.spawnMul||1);}
  let nDoor=0;
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    if(z.dead>0){z.dead-=dt;if(z.dead<=0)zombies.splice(i,1);continue;}
    if(z.flee){z.x+=60*dt;if(z.x>500)zombies.splice(i,1);continue;}
    if(z.poison>0){z.poison-=dt;z.hp-=8*dt;}
    if(z.slow>0)z.slow-=dt;
    if(z.hp<=0){
      if(z.type==='boss'){z.dead=1.2;boss=null;bossDone=true;stats.boss=true;stats.kills++;score+=300;tray.mystery++;tray.wagyu+=2;flashT=0.6;sfx.boom();music.sting();
        $('bossbar').style.display='none';burst(z.x,z.y+20,60,'#ffe066',50);pop(300,80,`打倒了${z.name}！獲得神秘食材、A5和牛 ×2`,'#ffe066',true);continue;}
      z.dead=0.5;stats.kills++;killsSinceAngel++;score+=10;pop(z.x,z.y-6,'+10','#9fd3ff');burst(z.x,z.y+12,12,'#6d8f5a',25);
      if(Math.random()<0.22)setTimeout(()=>{if(state==='play')giveIngredient(z.x-20,z.y+30,'殭屍掉了：',0.5);},300);
      continue;
    }
    if(z.distract>0){z.distract-=dt;continue;}
    const spd=z.sp*(z.slow>0?0.4:1);
    if(z.confuse>0){z.confuse-=dt;z.atDoor=false;z.x=Math.min(480,z.x+spd*1.3*dt);continue;}

    }
    if(!z.atDoor){
      z.x-=spd*dt;z.y+=(z.ty-z.y)*Math.min(1,dt*1.5);
      const front=z.type==='boss'?418:406+Math.min(28,nDoor*5);

    }else{nDoor++;const dmg=z.type==='boss'?CFG.bossDmg*(z.phase===2?1.4:1):z.type==='rider'?CFG.riderDmg:CFG.doorDmg;doorHP-=dmg*(z.slow>0?0.5:1)*(CHARS.some(c=>c.active&&c.guard&&c.defense)?0.6:1)*dt;if(Math.random()<dt*0.8)sfx.thud();}

}

  ell(g,TABLE.x,TABLE.y+5,TABLE.rx+1,TABLE.ry+1,K);ell(g,TABLE.x,TABLE.y+5,TABLE.rx,TABLE.ry,'#5e3a24');
  ell(g,TABLE.x,TABLE.y,TABLE.rx+1,TABLE.ry+1,K);ell(g,TABLE.x,TABLE.y,TABLE.rx,TABLE.ry,'#a06a42');
  ell(g,TABLE.x,TABLE.y,TABLE.rx-6,TABLE.ry-5,'#a8724a');ell(g,TABLE.x,TABLE.y,TABLE.rx-8,TABLE.ry-7,'#a06a42');
  for(let i=0;i<5;i++)R(g,TABLE.x-70+i*30,TABLE.y-50+((i*17)%30),12,1,'#b07a52');
  active().forEach(c=>drawBowl(c.bowl[0],c.bowl[1]));
  drawPot(t,typeof hover==='string'&&hover.startsWith('side')?hover.slice(4):null);
  for(const o of pot){
    const[p,q]=slotPos(o,t),s=stOf(o);
    if(hover===o)ell(g,p,q,8,8,'#ffe066');else ell(g,p+1,q+1,6,5,'rgba(0,0,0,.28)');

      const w=10,bx=Math.round(p-5),by=Math.round(q-9);R(g,bx-1,by-1,w+2,4,K);
      if(s==='raw')R(g,bx,by,Math.max(1,Math.round(w*o.t/o.cook)),2,'#ffcf3b');
      else if(s==='ok')R(g,bx,by,w,2,((t/200)|0)%2?'#6dff7a':'#3fbf5a');
      else{R(g,bx,by,w,2,'#e74c3c');if(level.mom&&o.t>o.cook+winOf(o)+CFG.burnT-2&&((t/120)|0)%2)ell(g,p,q,7,7,'rgba(40,20,20,.45)');}
    }
  }
  PLATE_POS.forEach((_,i)=>drawPlate(i,t,hover==='p'+i));
  drawTray(t,hover);
  for(const p of parts)if(p.pot){g.fillStyle=p.col;g.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);}
  if(mom)drawMom(t);
  CHARS.filter(c=>c.active&&c.guard).sort((a,b)=>a.spot-b.spot).forEach(c=>{const p=GUARD_SPOTS[c.spot];drawAny(c,p.x,p.y,moodOf(c),t);if(c.kind!=='kiwi')drawGuardWeapon(p,t,c);});
  for(const b of balls){const x=b.x+(b.tx-b.x)*b.k,y=b.y+(b.ty-b.y)*b.k-Math.sin(Math.PI*b.k)*16;ell(g,x,y,3,3,K);ell(g,x,y,2,2,'#fff');R(g,x-1,y,3,1,'#2a7ad8');}
  zombies.filter(z=>z.type!=='boss').sort((a,b)=>a.y-b.y).forEach(z=>drawZombie(z,t));zombies.filter(z=>z.type==='boss').forEach(z=>drawBoss(z,t));
  for(const s of steals){const x=s.x+(s.tx-s.x)*s.k,y=s.y+(s.ty-s.y)*s.k-Math.sin(Math.PI*s.k)*20;drawIng(g,s.type,x,y,ING[s.type].ok,'ok',t);}
  if(coupleOut){const x=Math.round(coupleOut.x),y=coupleOut.y;drawAny(CHARS[3],x,y,'happy',t);}
  if(slashT>0){g.globalAlpha=Math.min(1,slashT*2);for(let i=0;i<4;i++){const ox=396+i*22,oy=40+((i*37)%60);for(let k=0;k<60;k++)R(g,ox+k*0.9-20,oy+k*2.6,2,2,i%2?'#ffffff':'#ffe066');}g.globalAlpha=1;}
  if(knock.state==='active'){const bo=CHARS[3],bx=430,by=176+Math.round(Math.sin(t/150));drawAny(bo,bx,by,'shock',t);R(g,bx+8,by-16,9,12,K);R(g,bx+9,by-15,7,10,'#fff');R(g,bx+11,by-14,3,5,'#c0392b');R(g,bx+11,by-8,3,2,'#c0392b');}
  active().forEach(c=>{
    const p=charPos(c),bx=p.x-11,by=p.y-11;
    if(hover===c){R(g,p.x-16,p.y-7,33,1,'#ffe066');R(g,p.x-16,p.y+37,33,1,'#ffe066');R(g,p.x-16,p.y-7,1,45,'#ffe066');R(g,p.x+16,p.y-7,1,45,'#ffe066');}
    R(g,bx-1,by-1,24,4,K);R(g,bx,by,Math.round(22*c.sat/100),2,c.sat<20?'#e74c3c':'#ffcf3b');
    if(c.stun>0)R(g,bx,by+3,Math.round(22*c.stun/7),1,'#b46bff');
    if(c.debuff){const col=c.debuff.type==='taste'?'#9dff3b':'#a0c0ff';R(g,bx,by+3,Math.round(22*c.debuff.t/12),1,col);
      if(c.debuff.type==='sleepy'){const k=((t/400)|0)%3;R(g,p.x+12+k,p.y-4-k*3,3,1,'#fff');R(g,p.x+14+k,p.y-3-k*3,1,1,'#fff');R(g,p.x+12+k,p.y-2-k*3,3,1,'#fff');}
      else{const a=t/150;R(g,p.x+Math.cos(a)*9,p.y-2+Math.sin(a)*2,2,2,'#9dff3b');}}
  });
  if(hover==='fridge'){R(g,FRIDGE.x-2,FRIDGE.y-1,FRIDGE.w+4,1,'#ffe066');R(g,FRIDGE.x-2,FRIDGE.y+FRIDGE.h,FRIDGE.w+4,1,'#ffe066');}
  for(const p of steam){g.fillStyle=`rgba(245,240,235,${p.l*0.35})`;const s=p.l<0.5?2:1;g.fillRect(Math.round(p.x),Math.round(p.y),s,s);}
  if(angel)drawAngel(t);
  for(const p of proj){const x=p.sx+(p.tx-p.sx)*p.k,y=p.sy+(p.ty-p.sy)*p.k-Math.sin(Math.PI*p.k)*34;drawIng(g,p.o.type,x,y,ingColor(p.o)||'#fff',stOf(p.o),t);}
  for(const p of parts)if(!p.pot){g.fillStyle=p.col;g.globalAlpha=Math.min(1,p.l*2);g.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);}
  g.globalAlpha=1;
  if(isDay()){g.fillStyle='rgba(255,240,200,0.10)';g.fillRect(0,0,W,H);}else{
  const gr=g.createRadialGradient(POT.x,POT.y,10,POT.x,POT.y,300);
  gr.addColorStop(0,'rgba(255,170,80,0.16)');gr.addColorStop(0.45,'rgba(40,20,60,0.06)');gr.addColorStop(1,'rgba(8,4,20,0.5)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  R(g,392,0,80,H,'rgba(5,5,25,0.25)');}
  const sl=g.createRadialGradient(450,40,2,450,40,70);sl.addColorStop(0,'rgba(255,230,160,0.22)');sl.addColorStop(1,'rgba(255,230,160,0)');g.fillStyle=sl;g.fillRect(392,0,88,120);
  if(boss&&boss.phase===2&&((t/300)|0)%2){g.fillStyle='rgba(255,30,30,0.05)';g.fillRect(0,0,W,H);}
  if(flashT>0){g.fillStyle=`rgba(255,236,150,${flashT})`;g.fillRect(0,0,W,H);}
  if(held){ell(g,mx+2,my+5,5,2,'rgba(0,0,0,.4)');drawIng(g,held.type,mx,my,ingColor(held)||'#fff',stOf(held),t);
    if(inThrow(mx))R(g,mx-8,my-14,17,1,'#ffcf6b');}
}

function updateDOM(){
  labelsEl.style.display=state==='ending'?'none':'';
  const hr=level.bonus?12+Math.min(gameT,DUR)/DUR*1.5:18+Math.min(gameT,DUR)/DUR*12,h=Math.floor(hr)%24,m=Math.floor((hr%1)*60/10)*10;
  $('time').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  $('doorbar').style.width=Math.max(0,doorHP)+'%';$('doorbar').style.background=doorHP<33?'#e74c3c':doorHP<66?'#f0b43c':'#3fbf5a';
  $('aromabar').style.width=Math.min(100,aroma()/3.4*100)+'%';
  $('score').textContent=score;
  const cs='★'.repeat(combo)+'☆'.repeat(CFG.combo-combo);if($('combo').textContent!==cs)$('combo').textContent=cs;
  $('waste').textContent=mom?(mom.phase==='watch'?'媽媽盯場中':'媽媽來了'):wasteN+'/'+CFG.wasteMax;
  $('friendBox').hidden=!level.ending;if(level.ending)$('friend').textContent=friendship+'/'+level.friend;
  $('soupBox').hidden=!(soupBuff>0);if(soupBuff>0)$('soup').textContent=Math.ceil(soupBuff);
  if(boss)$('bossHp').style.width=Math.max(0,boss.hp/boss.max*100)+'%';
  PLATE_POS.forEach((_,i)=>{const k=plates[i];const s=k?(stock[k]>0?ING[k].name+' ×'+stock[k]:ING[k].name+'（空）'):'';if(plateLbl[i].textContent!==s)plateLbl[i].textContent=s;});
  for(const k in TRAY_POS){const s=tray[k]>0?({mystery:'福丸',momegg:'滷蛋',drink:'冰飲'}[k]||ING[k].name)+'×'+tray[k]:'';if(trayLbl[k].textContent!==s)trayLbl[k].textContent=s;}
  const fs=state==='play'?(fridgeCD>0?'冰箱 '+Math.ceil(fridgeCD)+'s':'冰箱 可搜刮！'):'冰箱';if(fridgeLbl.textContent!==fs)fridgeLbl.textContent=fs;
  CHARS.forEach((c,i)=>{const d=charLbl[i];if(!c.active){d.textContent='';return;}const p=charPos(c);d.style.left=(p.x/W*100)+'%';d.style.top=((p.y-21)/H*100)+'%';
    const tag=c.kind==='cat'?'（餵飽度）':level.plates.includes('cil')?(c.cil?'🌿':'✖🌿'):'';
    const s=c.name+tag+(c.guard?'（守門）':c.stun>0?'（中毒）':c.debuff?(c.debuff.type==='taste'?'（味覺錯亂）':'（想睡）'):'');if(d.textContent!==s)d.textContent=s;});
  if(mom){momLbl.style.left=(mom.x/W*100)+'%';momLbl.style.top=((mom.y-21)/H*100)+'%';if(momLbl.textContent!=='媽媽')momLbl.textContent='媽媽';}else if(momLbl.textContent)momLbl.textContent='';
}

reset();renderLevelList();renderLevelInfo();
let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;update(dt,t);render(t);updateDOM();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
